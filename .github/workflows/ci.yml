name: CI

on: [push, pull_request]

jobs:
  build:
    timeout-minutes: 60
    env:
      # No Ark on the BLAKE2b regtest: its tests are skipped
      BOLTZ_REGTEST_ARK: 'off'
    strategy:
      matrix:
        platform: [ubuntu-latest]
        node-version: [24]
        # The toolchain the image is built with (docker/boltz/Dockerfile):
        # a newer stable brings lints on code we do not write
        rust-version: ['1.98.1']

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
        with:
          node-version: ${{ matrix.node-version }}
          rust-version: ${{ matrix.rust-version }}
          cache-prefix: npm-rust-build

      # Boltz's regtest on the BLAKE2b chain (regtest-blake2b/): Knots,
      # Lightning Fork and privkeyio's Core Lightning, without what cannot
      # read BLAKE2b blocks (electrs, Esplora, the Ark stack)
      - name: Start regtest
        id: start_regtest
        timeout-minutes: 20
        run: npm run regtest:start:ci:blake2b && sudo chmod -R 777 regtest

      - name: Docker Logs
        if: failure() && steps.start_regtest.outcome == 'failure'
        run: |
          docker image ls -a
          docker ps -a
          cd regtest
          export COMPOSE_FILE=docker-compose.yml:../regtest-blake2b/docker-compose.blake2b.yml
          docker compose ps
          docker compose logs

      - name: Compile
        run: npm run compile

      - name: Type check tests
        run: npm run compile:typescript:test

      - name: Prettier
        run: npm run prettier:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit -- -w 2

      - name: Integration tests
        run: node run-int.js

  build-rust:
    timeout-minutes: 60
    env:
      # No Ark on the BLAKE2b regtest: its tests are skipped
      BOLTZ_REGTEST_ARK: 'off'
    permissions:
      contents: read
    strategy:
      matrix:
        platform: [ubuntu-latest]
        node-version: [24]
        # The toolchain the image is built with (docker/boltz/Dockerfile):
        # a newer stable brings lints on code we do not write
        rust-version: ['1.98.1']

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
        with:
          node-version: ${{ matrix.node-version }}
          rust-version: ${{ matrix.rust-version }}
          cache-prefix: cargo-build

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Install clippy
        run: rustup component add clippy

      # Boltz's regtest on the BLAKE2b chain (regtest-blake2b/): Knots,
      # Lightning Fork and privkeyio's Core Lightning, without what cannot
      # read BLAKE2b blocks (electrs, Esplora, the Ark stack)
      - name: Start regtest
        id: start_regtest
        timeout-minutes: 20
        run: npm run regtest:start:ci:blake2b && sudo chmod -R 777 regtest

      - name: Docker Logs
        if: failure() && steps.start_regtest.outcome == 'failure'
        run: |
          docker image ls -a
          docker ps -a
          cd regtest
          export COMPOSE_FILE=docker-compose.yml:../regtest-blake2b/docker-compose.blake2b.yml
          docker compose ps
          docker compose logs

      - name: Compile
        run: cargo build

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        # The Ark modules need fulmine, which the BLAKE2b regtest does not run
        run: cargo test -- --skip 'ark::'
        env:
          MEMPOOL_API_URL: ${{ vars.MEMPOOL_API_URL }}

  build-boltz-core:
    timeout-minutes: 60
    strategy:
      matrix:
        platform: [ubuntu-latest]
        node-version: [24]
        # The toolchain the image is built with (docker/boltz/Dockerfile):
        # a newer stable brings lints on code we do not write
        rust-version: ['1.98.1']

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
        with:
          node-version: ${{ matrix.node-version }}
          rust-version: ${{ matrix.rust-version }}
          cache-prefix: cargo-boltz-core

      - name: Install just
        uses: extractions/setup-just@v4

      - name: boltz-core feature matrix
        run: just boltz-core-features

      - name: boltz-core docs
        run: just boltz-core-docs-features

  api-generation-validation:
    timeout-minutes: 60
    strategy:
      matrix:
        platform: [ubuntu-latest]
        node-version: [24]
        python-version: ['3.14']

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Generate proto files
        run: npm run proto

      - name: Check swagger spec is up to date
        run: |
          npm run swagger
          git diff --exit-code -- swagger-spec.json

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: OpenAPI Spec Validation
        run: npm run swagger:validate
